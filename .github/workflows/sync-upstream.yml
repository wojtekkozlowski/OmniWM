name: Sync from upstream

# Merges OmniNull/OmniWM main into this fork. It only merges: OmniWM needs the
# macOS 27 SDK, which GitHub's hosted macOS images do not have (upstream builds
# on its own self-hosted `xcode-27` runner), so the build, tests and releases
# happen locally, as docs/FORK.md describes. The merged branch is therefore
# unverified until the next local build; nothing installs from the branch.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Merge, but push nothing
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    name: Merge and push
    if: github.repository == 'wojtekkozlowski/OmniWM'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: smooth-scroll
          fetch-depth: 0
          # The default token cannot push changes to workflow files, which upstream
          # makes now and then; set SYNC_TOKEN (a PAT with the `workflow` scope) when
          # a run fails on that. Pushes made with a PAT also trigger the CI and
          # Website workflows inherited from upstream, so disable those in the
          # fork's Actions tab first: their `xcode-27` runner does not exist here.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream main
        id: merge
        run: |
          git remote add upstream https://github.com/OmniNull/OmniWM.git
          git fetch --no-tags upstream main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "smooth-scroll already contains upstream main." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            if ! git merge --no-edit upstream/main; then
              echo "::error::Merging upstream main conflicts. Resolve these by hand:"
              git diff --name-only --diff-filter=U
              {
                echo "## Merge conflict"
                echo
                echo "Resolve locally: \`git fetch origin && git merge origin/main\` on smooth-scroll."
                echo
                git diff --name-only --diff-filter=U | sed 's/^/- /'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Merged upstream main into smooth-scroll"
              echo
              git log --oneline "$before..upstream/main" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push
        if: inputs.dry_run != true
        env:
          CHANGED: ${{ steps.merge.outputs.changed }}
        run: |
          git push origin upstream/main:refs/heads/main
          if [ "$CHANGED" = "true" ]; then
            git push origin HEAD:smooth-scroll
          fi
